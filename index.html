<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickList</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./image/icons8-checked-48 (1).png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <script src="main.js" defer></script>
</head>

<body>

    <header>
        <img src="./image/logo.png" alt="Logo do QuickList">
    </header>

    <main>

        <section class="adicionar-item">
            <h1>Compras da semana</h1>

            <div>
                <input type="text" id="item-input" placeholder="Adicione um novo item">
                <button id="btn-adicionar">
                    Adicionar item
                </button>
            </div>
        </section>

        <section class="lista" id="lista-compras">
           
        </section>

        
    </main>

</body>

</html>
